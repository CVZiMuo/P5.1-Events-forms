<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Store - Pet Profiles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Pet Store</h1>
    </header>

    <main>
        <!-- Pet form -->
        <section class="form-section">
            <h2>Add a pet</h2>
            <!-- novalidate: validation is handled by our own JavaScript -->
            <form id="pet-form" novalidate>
                <div class="field">
                    <label for="name">Pet name</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="field">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description">
                </div>

                <div class="field">
                    <label for="image">Image URL</label>
                    <input type="url" id="image" name="image" placeholder="example image">
                </div>

                <div class="field">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate">
                </div>

                <div class="field">
                    <label for="price">Price (€)</label>
                    <input type="number" id="price" name="price" step="0.01">
                </div>

                <div class="field">
                    <label for="code">Pet code</label>
                    <input type="text" id="code" name="code" placeholder="CAT123">
                </div>

                <div class="field_checkbox">
                    <input type="checkbox" id="sold" name="sold">
                    <label for="sold">Sold</label>
                </div>

                <button type="submit">Add Pet</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
